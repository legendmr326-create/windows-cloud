<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#dce9f8"><meta name="application-name" content="Windows Cloud"><link rel="icon" type="image/png" sizes="512x512" href="assets/app-icon-512.png"><link rel="apple-touch-icon" sizes="192x192" href="assets/app-icon-192.png"><link rel="manifest" href="manifest.json"><title>Windows Cloud</title><style>
:root{--ink:#182334;--muted:#627187;--line:rgba(255,255,255,.76);--shadow:0 22px 70px rgba(31,52,88,.24)}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--ink);user-select:none}button{font:inherit}.desktop{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 70% 45%,#fff 0 5%,#a2d2ff 17%,transparent 39%),radial-gradient(ellipse at 65% 45%,#4988d2 0 17%,transparent 45%),radial-gradient(ellipse at 31% 60%,#fff 0 3%,#80b7f0 15%,transparent 38%),linear-gradient(135deg,#d8eafb,#84b6ec 42%,#4a79ba)}.desktop:before{content:"";position:absolute;inset:-15%;background:radial-gradient(ellipse at 72% 58%,#ffffffb3,transparent 22%),radial-gradient(ellipse at 40% 48%,#1f61b75c,transparent 34%);filter:blur(42px);pointer-events:none}.desktop-icons{position:absolute;z-index:1;top:22px;left:18px;display:grid;gap:13px}.desktop-icon{width:78px;min-height:78px;border:1px solid transparent;background:transparent;border-radius:8px;color:white;text-shadow:0 1px 4px #315276;padding:8px 5px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;cursor:pointer}.desktop-icon:hover,.desktop-icon:focus{background:#ffffff33;border-color:#ffffff59;outline:0}.app-icon{height:36px;width:36px;display:grid;place-items:center;font-size:22px;border-radius:10px;background:linear-gradient(145deg,#fff,#dce8f8);box-shadow:0 3px 9px #274f7b24;text-shadow:none}.taskbar{position:absolute;z-index:1000;bottom:0;left:0;width:100%;height:62px;background:#f7faffc7;backdrop-filter:blur(24px) saturate(1.35);border-top:1px solid #ffffffb3;display:flex;align-items:center;justify-content:center}.task-center{height:100%;display:flex;align-items:center;gap:5px}.task-btn{position:relative;height:46px;min-width:46px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:#24405f;font-size:22px;display:grid;place-items:center;cursor:pointer}.task-btn:hover,.task-btn.active{background:#ffffffba}.task-btn.active:after{content:"";position:absolute;bottom:2px;width:14px;height:3px;border-radius:4px;background:#2475dc}.win-logo{width:23px;height:23px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;transform:perspective(70px) rotateY(-8deg)}.win-logo i{display:block;background:#1685ee}.task-search{width:205px;height:37px;border-radius:6px;background:#ffffffe0;border:1px solid #a6b8d280;font-size:13px;color:#586980;display:flex;align-items:center;gap:8px;padding:0 12px;cursor:pointer}.tray{position:absolute;right:18px;display:flex;align-items:center;gap:10px;color:#34445b;font-size:13px}.clock{line-height:1.25;text-align:right;font-size:12px}.start-menu{position:absolute;z-index:900;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);width:min(640px,calc(100vw - 24px));max-height:min(720px,calc(100vh - 90px));overflow:auto;padding:25px 28px 20px;border:1px solid var(--line);border-radius:12px;background:#f7faffE3;backdrop-filter:blur(34px) saturate(1.35);box-shadow:var(--shadow);opacity:0;visibility:hidden;transition:.18s}.start-menu.open{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}.searchbar{height:39px;border-radius:5px;border:1px solid #5b84b885;background:#ffffffd9;display:flex;align-items:center;padding:0 12px;gap:10px;color:#55708f;margin-bottom:24px}.searchbar input{border:0;background:transparent;outline:0;flex:1;font:14px inherit;color:var(--ink)}.section-heading{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:650;margin:0 4px 14px}.all-btn{background:#fff;border:1px solid #d4deea;border-radius:5px;padding:5px 11px;color:#42556d;font:12px inherit;cursor:pointer}.pins{display:grid;grid-template-columns:repeat(6,1fr);gap:8px 5px}.pin{min-height:78px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;border-radius:6px;border:1px solid transparent;background:transparent;color:#24344a;font-size:12px;cursor:pointer}.pin:hover{background:#ffffffb8;border-color:#fff}.pin .app-icon{width:38px;height:38px;font-size:21px}.tiles-heading{margin-top:24px}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.tile{height:76px;border:0;border-radius:7px;padding:11px;color:white;display:flex;align-items:flex-end;font-size:12px;font-weight:600;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff55;transition:transform .15s}.tile:hover{transform:translateY(-2px)}.tile:nth-child(1){background:linear-gradient(135deg,#1688e8,#35b3ed)}.tile:nth-child(2){background:linear-gradient(135deg,#7359df,#9b74f1)}.tile:nth-child(3){background:linear-gradient(135deg,#00a88a,#31cba5)}.tile:nth-child(4){background:linear-gradient(135deg,#e89024,#ffc34d)}.menu-footer{margin:22px -28px -20px;padding:13px 28px;background:#e9f0f8aa;display:flex;justify-content:space-between;align-items:center;font-size:13px}.user-chip{display:flex;align-items:center;gap:9px}.avatar{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#b5d6ff,#748feb);color:white;font-weight:700}.power{font-size:19px;border:0;background:transparent;cursor:pointer;color:#34445b}
.window-layer{position:absolute;inset:0 0 62px;z-index:20;pointer-events:none}.app-window{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(680px,calc(100vw - 24px));height:min(460px,calc(100vh - 100px));min-width:min(300px,calc(100vw - 24px));min-height:230px;border:1px solid #ffffffeb;border-radius:9px;background:#fafcffF5;box-shadow:0 24px 80px #192f4e52;overflow:hidden;pointer-events:auto;animation:windowIn .2s ease-out}.app-window.maximized{left:8px!important;top:8px!important;width:calc(100% - 16px)!important;height:calc(100% - 16px)!important;transform:none!important}@keyframes windowIn{from{opacity:0;scale:.98}to{opacity:1;scale:1}}.titlebar{height:42px;display:flex;align-items:center;justify-content:space-between;background:#ffffffc7;border-bottom:1px solid #e8edf4;padding-left:13px;cursor:grab}.titlebar:active{cursor:grabbing}.title-left{display:flex;align-items:center;gap:9px;font-size:13px}.title-left .app-icon{height:23px;width:23px;font-size:14px;border-radius:6px}.win-controls{display:flex;height:100%}.win-controls button{width:45px;border:0;background:transparent;color:#3c4c60;cursor:pointer;font-size:13px}.win-controls button:hover{background:#e7edf5}.win-controls .close:hover{background:#d94848;color:white}.app-content{height:calc(100% - 42px);overflow:auto;padding:25px 28px;background:linear-gradient(135deg,#f9fbff,#f0f5fc)}.app-content h1{font-size:24px;font-weight:600;margin:0 0 8px}.app-content p{color:#5c6e85;line-height:1.55}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-top:20px}.card{background:white;border:1px solid #e2eaf4;border-radius:9px;padding:17px;box-shadow:0 4px 14px #31527b0c}.card strong{display:block;margin:9px 0 5px}.card small{color:#687990}.splash{position:absolute;inset:42px 0 0;z-index:5;background:#fbfdff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:21px;transition:opacity .25s}.splash-logo{width:72px;height:72px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5px;perspective:150px;animation:logoPulse .95s ease-in-out infinite alternate}.splash-logo i{background:#087bea;box-shadow:0 3px 12px #087bea24;animation:tileGlow 1.1s ease-in-out infinite alternate}.splash-logo i:nth-child(2){animation-delay:.12s}.splash-logo i:nth-child(3){animation-delay:.24s}.splash-logo i:nth-child(4){animation-delay:.36s}@keyframes logoPulse{to{transform:perspective(150px) rotateY(-12deg) scale(1.06)}}@keyframes tileGlow{to{background:#3da8ff}}.loading-label{color:#586a80;font-size:13px;letter-spacing:.2px}.progress{width:128px;height:3px;border-radius:5px;background:#dce8f5;overflow:hidden}.progress:after{content:"";display:block;width:35%;height:100%;background:#1683ec;border-radius:5px;animation:loading 1s ease-in-out infinite}@keyframes loading{from{transform:translateX(-120%)}to{transform:translateX(390%)}}.toast{position:absolute;z-index:1200;bottom:76px;left:50%;transform:translateX(-50%);background:#f7fbffeb;border:1px solid white;border-radius:8px;padding:11px 17px;box-shadow:0 8px 25px #24466b24;color:#33465d;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.context-note{position:absolute;bottom:78px;left:22px;color:white;text-shadow:0 1px 4px #38577b;font-size:12px;opacity:.9}@media(max-width:650px){.start-menu{padding:20px 16px 16px}.menu-footer{margin:18px -16px -16px;padding:12px 16px}.pins{grid-template-columns:repeat(4,1fr)}.tiles{grid-template-columns:repeat(2,1fr)}.task-search{width:42px;font-size:0;justify-content:center;padding:0}.task-search span:last-child{display:none}.tray{display:none}.desktop-icons{top:10px;left:8px}.app-window{height:min(440px,calc(100vh - 95px))}.app-content{padding:20px 18px}.context-note{display:none}}
</style></head><body><main class="desktop" id="desktop" aria-label="Windows 11 style desktop"><div class="desktop-icons" id="desktopIcons"></div><div class="window-layer" id="windowLayer"></div><div class="context-note">A fresh, friendly desktop</div><section class="start-menu" id="startMenu" aria-label="Start menu"><label class="searchbar"><span>⌕</span><input id="appSearch" type="search" placeholder="Search for apps, settings, and documents" autocomplete="off"></label><div class="section-heading"><span>Pinned</span><button class="all-btn" id="allApps">All apps　›</button></div><div class="pins" id="pins"></div><div class="section-heading tiles-heading"><span>Explore</span><button class="all-btn" id="moreTiles">More　›</button></div><div class="tiles" id="tiles"></div><div class="menu-footer"><div class="user-chip"><span class="avatar">A</span><span>Alex Morgan</span></div><button class="power" id="powerButton" title="Power">⏻</button></div></section><nav class="taskbar" aria-label="Taskbar"><div class="task-center"><button class="task-btn" id="startButton" title="Start"><span class="win-logo"><i></i><i></i><i></i><i></i></span></button><button class="task-search" id="taskSearch"><span>⌕</span><span>Search</span></button><div id="taskApps" class="task-center"></div></div><div class="tray"><span>⌃</span><span>◖</span><span>◕</span><div class="clock"><div id="timeText"></div><div id="dateText"></div></div></div></nav><div class="toast" id="toast"></div></main><script>
(()=>{const apps=[
{id:'edge',name:'Microsoft Edge',icon:'🌐',color:'#daf2ff',desc:'Your web, made beautiful.',body:'Explore the web with a clean, welcoming browser experience.',cards:[['⌕','Search the web','Find useful pages and answers.'],['☆','Favorites','Your favorite places, all together.'],['◷','Recent activity','Pick up where you left off.']]},
{id:'files',name:'File Explorer',icon:'📁',color:'#fff0c8',desc:'Your files, neatly organized.',body:'Browse recent files, folders, and quick access from one place.',cards:[['📄','Getting started.txt','Just now · Documents'],['🖼️','Wallpaper.png','Yesterday · Pictures'],['📦','Project files','This week · Downloads']]},
{id:'store',name:'Microsoft Store',icon:'🛍️',color:'#e6e4ff',desc:'Find something new.',body:'A cheerful home for apps, games, and entertainment.',cards:[['🎨','Creative tools','Make your next idea.'],['🎮','Games','A little fun, one click away.'],['🎵','Music','Soundtrack your day.']]},
{id:'photos',name:'Photos',icon:'🌄',color:'#ffe4e4',desc:'Remember the good stuff.',body:'A bright home for your favorite pictures and memories.',cards:[['🌅','Morning light','A favorite moment'],['🏞️','Weekend trip','12 photos'],['✨','On this day','A memory from last year']]},
{id:'settings',name:'Settings',icon:'⚙️',color:'#e5eaf1',desc:'Make this desktop yours.',body:'Personalize your display and keep everything feeling just right.',cards:[['☼','Appearance','Light and soft desktop'],['◉','Display','Comfortable viewing'],['⌘','About','Windows-style web desktop']]},
{id:'calendar',name:'Calendar',icon:'📅',color:'#ffe4e4',desc:'A little more room in your day.',body:'Keep track of the things that matter, all in one calm place.',cards:[['31','Today','A fresh start'],['☼','Focus time','Make space for good work'],['＋','New event','Add a moment to your calendar']]},
{id:'mail',name:'Mail',icon:'✉️',color:'#deefff',desc:'Your inbox at a glance.',body:'A simple, friendly place to keep conversations close.',cards:[['✉','Welcome','Your desktop is ready'],['☆','Favorites','People you love hearing from'],['＋','Compose','Start a new message']]},
{id:'notepad',name:'Notepad',icon:'🗒️',color:'#e5f5e8',desc:'A quiet place for your thoughts.',body:'Write something down. Your next great idea can start here.',cards:[['＋','New note','Start with a blank page'],['☰','Quick notes','Small thoughts, saved'],['✓','To-do list','One thing at a time']]},
{id:'music',name:'Media Player',icon:'🎵',color:'#f0e5ff',desc:'Press play on your day.',body:'A relaxed spot for music, videos, and your favorite sounds.',cards:[['▶','Now playing','A calm afternoon mix'],['♫','Your library','Music for every mood'],['＋','Play something','Pick a favorite']]},
{id:'calculator',name:'Calculator',icon:'🧮',color:'#e7eef7',desc:'Quick sums, clear answers.',body:'A tidy calculator for everyday little calculations.',cards:[['＋','Standard','Everyday calculations'],['％','Percentage','Work out a percentage'],['↔','Converter','Make units make sense']]},
{id:'weather',name:'Weather',icon:'🌤️',color:'#fff1d3',desc:'A sunny little forecast.',body:'A soft sky, a fresh breeze, and a good day to get started.',cards:[['☀️','Today','Bright and comfortable'],['🌤️','This week','A little sunshine ahead'],['⌖','Your place','Choose a location']]},
{id:'clock',name:'Clock',icon:'⏰',color:'#e4ecff',desc:'Take your time.',body:'Keep time, set a timer, or give yourself a few quiet minutes.',cards:[['◷','World clock','Across your time zones'],['⏱','Timer','A little focus session'],['⏰','Alarm','Wake up gently']]}
];
const tiles=[['✦','Discover apps','store'],['☁','Your cloud','files'],['☼','Make it yours','settings'],['♫','Take a break','music']];const $=id=>document.getElementById(id),menu=$('startMenu'),layer=$('windowLayer');let z=30,toastTimer;function notify(text){const t=$('toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800)}function iconMarkup(a){return `<span class="app-icon" style="background:linear-gradient(145deg,#fff,${a.color})">${a.icon}</span>`}function renderPins(filter=''){$('pins').innerHTML='';apps.filter(a=>a.name.toLowerCase().includes(filter.toLowerCase())).forEach(a=>{const b=document.createElement('button');b.className='pin';b.innerHTML=`${iconMarkup(a)}<span>${a.name.replace('Microsoft ','')}</span>`;b.onclick=()=>openApp(a);$('pins').append(b)})}function renderDesktop(){$('desktopIcons').innerHTML='';[['files','This PC'],['edge','Microsoft Edge'],['photos','Photos']].forEach(([id,label])=>{const a=apps.find(x=>x.id===id),b=document.createElement('button');b.className='desktop-icon';b.innerHTML=`${iconMarkup(a)}<span>${label}</span>`;b.ondblclick=()=>openApp(a);b.onclick=()=>{document.querySelectorAll('.desktop-icon').forEach(x=>x.style.background='');b.style.background='#ffffff33'};$('desktopIcons').append(b)})}function renderTask(){$('taskApps').innerHTML='';['edge','files','store','settings'].forEach(id=>{const a=apps.find(x=>x.id===id),b=document.createElement('button');b.className='task-btn';b.title=a.name;b.innerHTML=a.icon;b.onclick=()=>openApp(a);$('taskApps').append(b)})}function renderTiles(){$('tiles').innerHTML='';tiles.forEach(([ico,label,id])=>{const b=document.createElement('button');b.className='tile';b.innerHTML=`<span>${ico} &nbsp; ${label}</span>`;b.onclick=()=>openApp(apps.find(a=>a.id===id));$('tiles').append(b)})}function openApp(a){menu.classList.remove('open');const w=document.createElement('section');w.className='app-window';w.style.zIndex=++z;w.innerHTML=`<header class="titlebar"><div class="title-left">${iconMarkup(a)}<span>${a.name}</span></div><div class="win-controls"><button class="minimize" title="Minimize">−</button><button class="maximize" title="Maximize">□</button><button class="close" title="Close">×</button></div></header><div class="app-content"><div class="app-body"><h1>${a.desc}</h1><p>${a.body}</p><div class="cards">${a.cards.map(c=>`<article class="card"><span style="font-size:22px">${c[0]}</span><strong>${c[1]}</strong><small>${c[2]}</small></article>`).join('')}</div></div></div><div class="splash"><div class="splash-logo"><i></i><i></i><i></i><i></i></div><div class="loading-label">Starting ${a.name}…</div><div class="progress"></div></div>`;layer.append(w);w.addEventListener('pointerdown',()=>w.style.zIndex=++z);const close=()=>w.remove();w.querySelector('.close').onclick=close;w.querySelector('.minimize').onclick=()=>w.style.display='none';w.querySelector('.maximize').onclick=()=>w.classList.toggle('maximized');w.querySelector('.titlebar').addEventListener('dblclick',()=>w.classList.toggle('maximized'));makeDraggable(w,w.querySelector('.titlebar'));setTimeout(()=>{const s=w.querySelector('.splash');if(s){s.style.opacity='0';setTimeout(()=>s.remove(),260)}},1750)}function makeDraggable(w,bar){let down=false,dx=0,dy=0;bar.addEventListener('pointerdown',e=>{if(e.target.closest('.win-controls')||w.classList.contains('maximized'))return;down=true;w.style.transform='none';const r=w.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!down)return;const x=Math.max(0,Math.min(innerWidth-w.offsetWidth,e.clientX-dx)),y=Math.max(0,Math.min(innerHeight-90,e.clientY-dy));w.style.left=x+'px';w.style.top=y+'px'});bar.addEventListener('pointerup',()=>down=false);bar.addEventListener('pointercancel',()=>down=false)}renderPins();renderDesktop();renderTask();renderTiles();$('startButton').onclick=()=>menu.classList.toggle('open');$('taskSearch').onclick=()=>{menu.classList.add('open');setTimeout(()=>$('appSearch').focus(),100)};$('appSearch').addEventListener('input',e=>renderPins(e.target.value));$('allApps').onclick=()=>{$('appSearch').focus();$('appSearch').value='';renderPins();notify('Showing all pinned apps')};$('moreTiles').onclick=()=>notify('You are all caught up');$('powerButton').onclick=()=>notify('Have a lovely day!');$('desktop').addEventListener('pointerdown',e=>{if(!e.target.closest('.start-menu')&&!e.target.closest('#startButton')&&!e.target.closest('#taskSearch'))menu.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')menu.classList.remove('open');if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='e')openApp(apps.find(a=>a.id==='files'))});function updateClock(){const n=new Date();$('timeText').textContent=n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});$('dateText').textContent=n.toLocaleDateString([],{month:'numeric',day:'numeric',year:'numeric'})}updateClock();setInterval(updateClock,30000)})();</script></body></html>
